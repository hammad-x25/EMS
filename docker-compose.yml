services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: aegis_exam
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_exam"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aegis_postgres_data:/var/lib/postgresql/data

volumes:
  aegis_postgres_data:
